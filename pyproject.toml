[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2word"
version = "1.0.0"
description = "Command-line tool that converts Markdown into Microsoft Word (.docx) documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jürgen Reitböck", email = "md2word@indianerbande.de" }]
keywords = ["markdown", "docx", "word", "converter", "cli", "ooxml"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business :: Office Suites",
]

dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "python-docx>=1.1",
    "lxml>=4.9",
    "Pygments>=2.15",
    "PyYAML>=6.0",
    "requests>=2.28",
    "Pillow>=9.0",
    "latex2mathml>=3.75",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]
dev = ["pytest>=7.4", "pyinstaller>=6.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
md2word = "md2word.cli:main"

[project.urls]
Homepage = "https://github.com/indianerbande/md2word"
Documentation = "https://github.com/indianerbande/md2word#readme"
Source = "https://github.com/indianerbande/md2word"
Issues = "https://github.com/indianerbande/md2word/issues"

[tool.setuptools]
packages = ["md2word"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::UserWarning"]
